version: 2
updates:
  # Maven dependencies (pom.xml)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    target-branch: "master"
    assignees:
      - "hendisantika"
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
      testing:
        dependency-type: "development"
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
      guava:
        patterns:
          - "com.google.guava:*"
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Stay on stable Spring Boot releases; major upgrades are done manually
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    target-branch: "master"
    assignees:
      - "hendisantika"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
